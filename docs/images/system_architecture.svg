<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2438"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="12" fill="url(#bg)"/>

  <!-- Title Header -->
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    MONEYVISION SYSTEM ARCHITECTURE
  </text>
  <text x="500" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8899ac" text-anchor="middle">
    Zero-Network Offline VND Recognition Engine &amp; Blind-First Multi-Modal Feedback
  </text>

  <!-- 4 Main Architecture Blocks -->

  <!-- 1. Hardware & Sensors -->
  <rect x="40" y="100" width="200" height="450" rx="8" fill="url(#cardGrad)" stroke="#2c3a58" stroke-width="1.5"/>
  <rect x="40" y="100" width="200" height="42" rx="8" fill="#1e2c47"/>
  <text x="140" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFE600" text-anchor="middle">1. HARDWARE &amp; SENSORS</text>
  
  <rect x="55" y="160" width="170" height="65" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="140" y="185" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Rear Camera2 / CameraX</text>
  <text x="140" y="205" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">YUV_420_888 (640x480)</text>

  <rect x="55" y="240" width="170" height="65" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="140" y="265" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Hardware Ambient Lux</text>
  <text x="140" y="285" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">Sensor.TYPE_LIGHT (Front)</text>

  <rect x="55" y="320" width="170" height="65" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="140" y="345" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">IMU Motion Sensors</text>
  <text x="140" y="365" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">TYPE_LINEAR_ACCEL</text>

  <rect x="55" y="400" width="170" height="65" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="140" y="425" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Proximity &amp; Thermal</text>
  <text x="140" y="445" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">TYPE_PROXIMITY / PowerMgr</text>

  <rect x="55" y="480" width="170" height="50" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="140" y="505" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Multi-Touch &amp; TalkBack</text>
  <text x="140" y="520" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">AccessibilityDelegate</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 240 325 L 280 325" stroke="#FFE600" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- 2. Optical Gate & Power Governor -->
  <rect x="280" y="100" width="200" height="450" rx="8" fill="url(#cardGrad)" stroke="#2c3a58" stroke-width="1.5"/>
  <rect x="280" y="100" width="200" height="42" rx="8" fill="#1e2c47"/>
  <text x="380" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFE600" text-anchor="middle">2. OPTICAL &amp; POWER GATE</text>

  <rect x="295" y="160" width="170" height="95" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="380" y="185" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Single-Pass Y Analyzer</text>
  <text x="380" y="205" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">Average Luma &amp; Glare Ratio</text>
  <text x="380" y="222" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">16x16 Motion Grid (ΔY)</text>
  <text x="380" y="239" font-family="monospace" font-size="10" fill="#FFE600" text-anchor="middle">Blur Gate: ΔY &gt; 32.0</text>

  <rect x="295" y="275" width="170" height="115" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="380" y="300" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">4-Layer Anti-Strobe Torch</text>
  <text x="380" y="320" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">Auto-ON &lt; 25 lux for 1.0s</text>
  <text x="380" y="337" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">12s Min Hold + Active Lock</text>
  <text x="380" y="354" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">2-Path Manual-OFF Re-Arm</text>
  <text x="380" y="371" font-family="monospace" font-size="10" fill="#FFE600" text-anchor="middle">60s Oscillation Latch</text>

  <rect x="295" y="410" width="170" height="120" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="380" y="435" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">3-Tier Power Governor</text>
  <text x="380" y="455" font-family="monospace" font-size="11" fill="#ff7675" text-anchor="middle">BURST Mode: 130ms (~7.7fps)</text>
  <text x="380" y="475" font-family="monospace" font-size="11" fill="#55efc4" text-anchor="middle">ECO Mode: 650ms (~1.5fps)</text>
  <text x="380" y="495" font-family="monospace" font-size="11" fill="#74b9ff" text-anchor="middle">HIBERNATION: 1500-3000ms</text>
  <text x="380" y="515" font-family="monospace" font-size="10" fill="#8899ac" text-anchor="middle">Camera2 stopRepeating()</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 480 325 L 520 325" stroke="#FFE600" stroke-width="2" fill="none"/>

  <!-- 3. AI Computer Vision Pipeline -->
  <rect x="520" y="100" width="200" height="450" rx="8" fill="url(#cardGrad)" stroke="#2c3a58" stroke-width="1.5"/>
  <rect x="520" y="100" width="200" height="42" rx="8" fill="#1e2c47"/>
  <text x="620" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFE600" text-anchor="middle">3. AI INFERENCE &amp; WALLET</text>

  <rect x="535" y="160" width="170" height="85" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="620" y="185" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">16x16 Tiled YUV-to-NCHW</text>
  <text x="620" y="205" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">L1 Cache-Friendly 90° CW</text>
  <text x="620" y="222" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">NORM_LUT[256] Precomputed</text>
  <text x="620" y="238" font-family="monospace" font-size="10" fill="#FFE600" text-anchor="middle">Tensor: [1, 3, 640, 640]</text>

  <rect x="535" y="260" width="170" height="75" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="620" y="285" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">LiteRT / TFLite Engine</text>
  <text x="620" y="305" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">yolo26_money_quant.tflite</text>
  <text x="620" y="322" font-family="monospace" font-size="10" fill="#55efc4" text-anchor="middle">2.75 MB INT8 (XNNPACK)</text>

  <rect x="535" y="350" width="170" height="80" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="620" y="375" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Row-Major Decoder &amp; NMS</text>
  <text x="620" y="395" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">0 reads on empty frames</text>
  <text x="620" y="412" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">Greedy NMS (IoU &gt;= 0.45)</text>
  <text x="620" y="426" font-family="monospace" font-size="10" fill="#FFE600" text-anchor="middle">Candidate Hint (0.28-0.50)</text>

  <rect x="535" y="445" width="170" height="90" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="620" y="470" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Debounce &amp; Wallet</text>
  <text x="620" y="490" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">5-Frame Majority Consensus</text>
  <text x="620" y="507" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">Presentation Peak Sets</text>
  <text x="620" y="524" font-family="monospace" font-size="10" fill="#FFE600" text-anchor="middle">&lt;1.5s Dropout Bridge</text>

  <!-- Arrow 3 to 4 -->
  <path d="M 720 325 L 760 325" stroke="#FFE600" stroke-width="2" fill="none"/>

  <!-- 4. Assistive Multi-Modal Output -->
  <rect x="760" y="100" width="200" height="450" rx="8" fill="url(#cardGrad)" stroke="#2c3a58" stroke-width="1.5"/>
  <rect x="760" y="100" width="200" height="42" rx="8" fill="#1e2c47"/>
  <text x="860" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFE600" text-anchor="middle">4. MULTI-MODAL OUTPUT</text>

  <rect x="775" y="160" width="170" height="115" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="860" y="185" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Smart Preemption Audio</text>
  <text x="860" y="205" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">24 Vietnamese Voice Clips</text>
  <text x="860" y="222" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">1-to-2 Multi-Note Upgrade</text>
  <text x="860" y="239" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">2-to-1 Flicker Silence</text>
  <text x="860" y="256" font-family="monospace" font-size="10" fill="#FFE600" text-anchor="middle">isReadingWallet Guard Lock</text>

  <rect x="775" y="290" width="170" height="110" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="860" y="315" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Multi-Tier Haptics</text>
  <text x="860" y="335" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">25ms 'Hold Steady' Pulse</text>
  <text x="860" y="352" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">Cotton: 35ms Pulse</text>
  <text x="860" y="369" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">Polymer: 70ms Pulse</text>
  <text x="860" y="386" font-family="monospace" font-size="10" fill="#FFE600" text-anchor="middle">100k-500k: 40ms + 140ms</text>

  <rect x="775" y="415" width="170" height="115" rx="6" fill="#0d1424" stroke="#253552"/>
  <text x="860" y="440" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">WCAG AAA Low-Vision HUD</text>
  <text x="860" y="460" font-family="monospace" font-size="11" fill="#FFE600" text-anchor="middle">64sp Solar Yellow Text</text>
  <text x="860" y="477" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">OLED #000000 Canvas (16.7:1)</text>
  <text x="860" y="494" font-family="monospace" font-size="11" fill="#7d8ea6" text-anchor="middle">16dp Edge Palm Rejection</text>
  <text x="860" y="511" font-family="monospace" font-size="10" fill="#55efc4" text-anchor="middle">Bottom Action Dock (48dp)</text>
</svg>
