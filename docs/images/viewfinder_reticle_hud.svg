<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" width="100%" height="100%">
  <defs>
    <filter id="yellowGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Device Frame (OLED Black #000000) -->
  <rect x="10" y="10" width="400" height="780" rx="28" fill="#000000" stroke="#252525" stroke-width="4"/>

  <!-- Pulse Border (8dp #FFE600 on active detection) -->
  <rect x="18" y="18" width="384" height="764" rx="22" fill="none" stroke="#FFE600" stroke-width="3" filter="url(#yellowGlow)"/>

  <!-- Top System Bar -->
  <rect x="30" y="32" width="90" height="26" rx="6" fill="#151515" stroke="#333333"/>
  <text x="75" y="49" font-family="-apple-system, monospace" font-size="11" font-weight="700" fill="#FFE600" text-anchor="middle">FLASH: AUTO</text>

  <rect x="150" y="32" width="100" height="26" rx="6" fill="#151515" stroke="#333333"/>
  <text x="200" y="49" font-family="-apple-system, monospace" font-size="11" font-weight="700" fill="#55efc4" text-anchor="middle">BURST (130ms)</text>

  <rect x="280" y="32" width="105" height="26" rx="6" fill="#151515" stroke="#333333"/>
  <text x="332" y="49" font-family="-apple-system, monospace" font-size="11" font-weight="700" fill="#74b9ff" text-anchor="middle">PIN: 88% | 33°C</text>

  <!-- 16dp Palm Rejection Boundaries (Left & Right Indicators) -->
  <rect x="20" y="70" width="16" height="630" fill="#ff4757" opacity="0.12"/>
  <line x1="36" y1="70" x2="36" y2="700" stroke="#ff4757" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="28" y="380" font-family="monospace" font-size="9" fill="#ff6b81" transform="rotate(-90 28 380)" text-anchor="middle">16dp EDGE GUARD</text>

  <rect x="384" y="70" width="16" height="630" fill="#ff4757" opacity="0.12"/>
  <line x1="384" y1="70" x2="384" y2="700" stroke="#ff4757" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="392" y="380" font-family="monospace" font-size="9" fill="#ff6b81" transform="rotate(90 392 380)" text-anchor="middle">16dp EDGE GUARD</text>

  <!-- 4-Corner Viewfinder Reticle (L-Corners #FFE600) -->
  <!-- Top-Left -->
  <path d="M 60 180 L 60 140 L 100 140" fill="none" stroke="#FFE600" stroke-width="4" stroke-linecap="round"/>
  <!-- Top-Right -->
  <path d="M 320 140 L 360 140 L 360 180" fill="none" stroke="#FFE600" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 60 480 L 60 520 L 100 520" fill="none" stroke="#FFE600" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 320 520 L 360 520 L 360 480" fill="none" stroke="#FFE600" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Hero Typography: Solar Yellow (#FFE600) on OLED Black -->
  <text x="210" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFE600" text-anchor="middle" letter-spacing="1">
    500.000₫
  </text>
  <text x="210" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFE600" text-anchor="middle" letter-spacing="0.5">
    NĂM TRĂM NGHÌN ĐỒNG
  </text>

  <!-- Denomination Polymer Color Badge -->
  <rect x="110" y="375" width="200" height="36" rx="8" fill="#0099FF" stroke="#33b5ff" stroke-width="2"/>
  <text x="210" y="399" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    POLYMER — XANH LƠ
  </text>

  <!-- Confidence & Latency Subtitle -->
  <text x="210" y="445" font-family="monospace" font-size="13" fill="#a4b0be" text-anchor="middle">
    Độ tin cậy: 98.4% | Độ trễ: 12ms
  </text>

  <!-- Fullscreen Gesture Hint Area -->
  <rect x="55" y="550" width="310" height="135" rx="10" fill="#0c1017" stroke="#1f2a3e" stroke-width="1.5"/>
  <text x="210" y="575" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFE600" text-anchor="middle">
    VÙNG CỬ CHỈ TRỢ NĂNG TOÀN MÀN HÌNH
  </text>
  <text x="75" y="602" font-family="-apple-system, sans-serif" font-size="11" fill="#ced6e0">
    • 1 Chạm: Nghe lại mệnh giá &amp; Rung xúc giác
  </text>
  <text x="75" y="624" font-family="-apple-system, sans-serif" font-size="11" fill="#ced6e0">
    • 2 Chạm: Bật / Tắt đèn Flash thủ công
  </text>
  <text x="75" y="646" font-family="-apple-system, sans-serif" font-size="11" fill="#ced6e0">
    • Giữ 1 giây: Đọc tổng tiền trong Ví
  </text>
  <text x="75" y="668" font-family="-apple-system, sans-serif" font-size="11" fill="#ced6e0">
    • 2 Ngón tay Chạm đúp: Xóa trắng phiên Ví
  </text>

  <!-- Bottom Action Dock (48dp Touch Targets) -->
  <rect x="30" y="705" width="170" height="52" rx="10" fill="#121824" stroke="#253552" stroke-width="1.5"/>
  <text x="115" y="726" font-family="-apple-system, sans-serif" font-size="10" fill="#747d8c" text-anchor="middle">TỔNG VÍ HIỆN TẠI</text>
  <text x="115" y="746" font-family="monospace" font-size="15" font-weight="800" fill="#FFE600" text-anchor="middle">700.000₫ (2 tờ)</text>

  <rect x="220" y="705" width="170" height="52" rx="10" fill="#121824" stroke="#253552" stroke-width="1.5"/>
  <text x="305" y="726" font-family="-apple-system, sans-serif" font-size="10" fill="#747d8c" text-anchor="middle">BẢN QUYỀN TÁC GIẢ</text>
  <text x="305" y="746" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#55efc4" text-anchor="middle">Nguyễn Quang Toàn</text>
</svg>
