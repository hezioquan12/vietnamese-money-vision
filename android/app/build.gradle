apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Folders */
    //   root = file("../")
    //   reactNativeDir = file("../node_modules/react-native")
    //   codegenDir = file("../node_modules/@react-native/codegen")
    //   cliPath = file("../node_modules/react-native/cli.js")
}

def enableProguardInReleaseBuilds = true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nckh.moneyvision"
    defaultConfig {
        applicationId "com.nckh.moneyvision"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    splits {
        abi {
            reset()
            enable false // Universal APK duy nhất
        }
    }

    aaptOptions {
        noCompress "tflite", "lite", "mp3", "wav"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.keystore')
            storePassword System.getenv("KEYSTORE_PASS") ?: "moneyvision2026"
            keyAlias "moneyvision"
            keyPassword System.getenv("KEY_PASS") ?: "moneyvision2026"
            v1SigningEnabled true
            v2SigningEnabled true
            v3SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/license.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/notice.txt",
                "META-INF/ASL2.0",
                "META-INF/*.kotlin_module"
            ]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // CameraX for Real-time 30 FPS Preview and Analysis
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // TensorFlow Lite Runtime & GPU Acceleration
    def tflite_version = "2.14.0"
    implementation "org.tensorflow:tensorflow-lite:${tflite_version}"
    implementation "org.tensorflow:tensorflow-lite-support:0.4.4"
    implementation "org.tensorflow:tensorflow-lite-gpu:${tflite_version}"

    // Kotlin Coroutines for Background AI Inference
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
